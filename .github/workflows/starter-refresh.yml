# starter-refresh 定期起動（GitHub Actions cron）
#
# スターター曲の週次自動選曲: published な pure-solo ソング（shorts/live/announcement除外）から
# メンバーごとに「視聴数トップ2 + 最新1曲」を選出し is_starter / starter_order を更新する。
# ingest-youtube.yml と同じHTTP起動方式。
#
# 注意:
# - schedule はデフォルトブランチ（main）上のworkflowのみ実行される（マージ後に有効化）。
# - リポジトリが60日間非活動だとGitHubがcronを自動停止する（手動で再有効化が必要）。
# - Secret `ADMIN_PASSWORD` は ingest-youtube と共用（登録済みならそのまま動く）。
# - `selected` の中身をechoするので、Actionsログが選曲履歴になる。

name: starter-refresh

on:
  schedule:
    - cron: '0 18 * * 6' # UTC、土曜18:00 = JST日曜03:00（UTC+9: 18+9=27→日曜03:00）
  workflow_dispatch: # 手動実行用

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke starter-refresh function
        run: |
          set -euo pipefail
          response=$(curl -sf --max-time 120 -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_PASSWORD }}" \
            https://vwp-archive.netlify.app/.netlify/functions/starter-refresh) \
            || { echo "curl failed: ネットワーク断 / Netlify 5xx / Function timeout の可能性（-f はHTTPエラー時に本文を捨てる）" >&2; exit 1; }
          echo "Response: ${response}"
          ok=$(echo "${response}" | jq -r '.ok')
          changed=$(echo "${response}" | jq -r '.changed')
          removed=$(echo "${response}" | jq -r '.removed')
          selected_count=$(echo "${response}" | jq -r '.selected | length')
          echo "ok=${ok} changed=${changed} removed=${removed} selected=${selected_count}"
          if [ "${changed}" != "0" ] && [ "${changed}" != "null" ]; then
            echo "--- selected（選曲結果） ---"
            echo "${response}" | jq -c '.selected[]'
          fi
          if [ "${ok}" != "true" ]; then
            echo "starter-refresh returned ok != true" >&2
            exit 1
          fi
