<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V.W.P ARCHIVE — WELCOME</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;700;900&family=Shippori+Mincho:wght@400;600&family=Barlow+Condensed:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#050710;
  --text:#e8ecf8;
  --text-sub:rgba(232,236,248,.4);
  --text-dim:rgba(232,236,248,.12);
}
html,body{
  height:100%;width:100%;background:var(--bg);color:var(--text);
  font-family:'Noto Sans JP','Barlow Condensed',sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;
}
.app{
  display:flex;flex-direction:column;
  height:100%;max-width:430px;margin:0 auto;
  position:relative;overflow:hidden;
}

/* ===== AMBIENT ===== */
.glow{
  position:absolute;border-radius:50%;filter:blur(110px);
  pointer-events:none;z-index:0;
  transition:background .7s ease,opacity .7s ease;
}
.glow-main{
  width:300px;height:300px;top:45%;left:55%;
  transform:translate(-50%,-50%);opacity:.14;
}

/* S-curve path line */
.curve-path{
  position:absolute;
  top:0;left:0;right:0;bottom:0;
  z-index:1;pointer-events:none;
  overflow:visible;
}
.curve-path svg{width:100%;height:100%}

/* ===== HEADER ===== */
.hdr{
  position:relative;z-index:10;text-align:center;
  padding:clamp(20px,5vh,40px) 20px 0;flex-shrink:0;
}
.hdr-sub{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:400;letter-spacing:4px;
  color:var(--text);text-transform:uppercase;margin-bottom:6px;
  opacity:0;animation:fadeIn .6s .2s ease forwards;
}
.hdr-title{
  font-family:'Cinzel',serif;
  font-size:clamp(18px,5vw,28px);font-weight:700;
  letter-spacing:3px;line-height:1.2;
  opacity:0;animation:fadeIn .6s .35s ease forwards;
}

/* ===== SCROLL AREA ===== */
.scroll-area{
  flex:1;position:relative;z-index:5;
  touch-action:none;cursor:grab;
  overflow:hidden;
}
.scroll-area:active{cursor:grabbing}

/* individual item */
.item{
  position:absolute;
  display:flex;align-items:center;
  gap:16px;
  transition:all .45s cubic-bezier(.22,1,.36,1);
  will-change:transform,opacity;
  pointer-events:auto;
  cursor:pointer;
}
.item:active{filter:brightness(1.1)}

/* circle */
.item-circle{
  flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
  transition:all .45s cubic-bezier(.22,1,.36,1);
  font-size:32px; /* fallback for emoji */
}
/* shine */
.item-circle::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.2),transparent 60%);
  pointer-events:none;
}

/* outer ring (only visible on active) */
.item-ring{
  position:absolute;inset:-5px;border-radius:50%;
  border:2px solid transparent;
  transition:border-color .45s ease, box-shadow .45s ease;
  pointer-events:none;
}

/* label (to the left of active) */
.item-label{
  font-family:'Shippori Mincho',serif;
  font-size:0px;
  font-weight:600;
  letter-spacing:2px;
  opacity:0;
  transition:all .45s cubic-bezier(.22,1,.36,1);
  white-space:nowrap;
  pointer-events:none;
}

/* ===== BOTTOM ===== */
.bottom{
  position:relative;z-index:10;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:0 20px clamp(20px,4vh,36px);
}
.btn-enter{
  display:flex;align-items:center;gap:8px;
  padding:14px 36px;border-radius:28px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(8px);
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:600;letter-spacing:3px;text-transform:uppercase;
  color:var(--text);cursor:pointer;transition:all .25s ease;
  opacity:0;animation:fadeIn .5s 1s ease forwards;
}
.btn-enter:active{transform:scale(.95);background:rgba(255,255,255,.12)}
.btn-enter svg{width:16px;height:16px;fill:var(--text)}

.btn-daily{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 18px;border-radius:20px;
  background:transparent;border:1px solid rgba(176,184,255,.12);
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:300;letter-spacing:2px;
  color:rgba(176,184,255,.55);cursor:pointer;transition:background .2s;
  opacity:0;animation:fadeIn .5s 1.15s ease forwards, bluePulse 3s 1.7s ease-in-out infinite;
}
.btn-daily:active{background:rgba(176,184,255,.1)}
.btn-daily .star{font-size:14px}

/* ===== TRANSITION ===== */
.trans{
  position:absolute;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);opacity:0;pointer-events:none;
  transition:opacity .35s ease;
}
.trans.active{opacity:1;pointer-events:auto}
.trans-text{
  font-family:'Cinzel',serif;font-size:18px;font-weight:500;
  letter-spacing:4px;opacity:0;transform:translateY(10px);
  transition:all .35s .15s ease;
}
.trans.active .trans-text{opacity:1;transform:translateY(0)}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes twinkle{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.4;transform:scale(.8)}
}
@keyframes bluePulse{
  0%,100%{
    color:rgba(176,184,255,.4);
    text-shadow:0 0 4px rgba(176,184,255,.0);
  }
  50%{
    color:rgba(176,184,255,.85);
    text-shadow:0 0 12px rgba(176,184,255,.35);
  }
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  .hdr-sub,.hdr-title,.btn-enter,.btn-daily{opacity:1!important}
}
@media(min-width:431px){
  .app{border:1px solid rgba(255,255,255,.05);border-radius:40px;height:92vh;margin-top:4vh;box-shadow:0 0 100px rgba(0,0,0,.6)}
}
</style>
</head>
<body>

<div class="app">
  <div class="glow glow-main" id="glowMain"></div>

  <!-- S-curve path -->
  <div class="curve-path" id="curvePath"></div>

  <div class="hdr">
    <div class="hdr-sub">Unofficial</div>
    <div class="hdr-title">V.W.P ARCHIVE</div>
  </div>

  <div class="scroll-area" id="scrollArea"></div>

  <div class="bottom">
    <div class="btn-enter" id="btnEnter" role="button">
      <span>PLAY ARCHIVE</span>
      <svg viewBox="0 0 24 24"><polygon points="8,5 20,12 8,19"/></svg>
    </div>
    <div class="btn-daily" id="btnDaily" role="button">
      <span class="star">✦</span> TODAY'S OBSERVATION
    </div>
  </div>

  <div class="trans" id="trans">
    <div class="trans-text" id="transText"></div>
  </div>
</div>

const N = MEMBERS.length;

// Config
const CENTER_SIZE = 110;  // center circle diameter
const SMALL_SIZE = 56;
const TINY_SIZE = 38;
const VERT_SPACING = 120; // vertical gap between items
const S_AMPLITUDE = 70;   // horizontal S-curve amplitude (px)

let activeIdx = 0;
let offset = 0;            // fractional scroll offset
let touchStartY = 0;
let isDragging = false;
let momentum = 0;
let animFrame = null;

const scrollArea = document.getElementById('scrollArea');
const glowMain = document.getElementById('glowMain');
const curvePath = document.getElementById('curvePath');
const btnEnter = document.getElementById('btnEnter');
const btnDaily = document.getElementById('btnDaily');
const trans = document.getElementById('trans');
const transText = document.getElementById('transText');

// Create item elements
const items = [];
MEMBERS.forEach((m, i) => {
  const el = document.createElement('div');
  el.className = 'item';
  el.dataset.idx = i;

  const circleContent = m.thumb
    ? `<img src="${m.thumb}" alt="${m.label}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block" onerror="this.style.display='none';this.parentElement.textContent='${m.emoji}'">`
    : m.emoji;

  el.innerHTML = `
    <div class="item-label" id="label-${i}">${m.label}</div>
    <div style="position:relative;flex-shrink:0">
      <div class="item-ring" id="ring-${i}"></div>
      <div class="item-circle" style="background:${m.grad}" id="circle-${i}">${circleContent}</div>
    </div>
  `;

  el.addEventListener('click', () => {
    // snap to this item
    const diff = i - activeIdx;
    let shortest = diff;
    if(Math.abs(diff - N) < Math.abs(shortest)) shortest = diff - N;
    if(Math.abs(diff + N) < Math.abs(shortest)) shortest = diff + N;
    offset = 0;
    activeIdx = i;
    momentum = 0;
    render(true);
  });

  scrollArea.appendChild(el);
  items.push(el);
});

// Position items along vertical S-curve
function render(smooth = false){
  const areaRect = scrollArea.getBoundingClientRect();
  const centerY = areaRect.height / 2;
  const centerX = areaRect.width * 0.55; // slightly right of center

  // draw S-curve path
  drawPath(areaRect.width, areaRect.height, centerX);

  const m = MEMBERS[activeIdx];
  glowMain.style.background = m.color;

  items.forEach((el, i) => {
    // distance from active (circular, accounting for wrap)
    let dist = i - activeIdx + offset;
    // wrap to nearest
    while(dist > N/2) dist -= N;
    while(dist < -N/2) dist += N;

    // vertical position
    const y = centerY + dist * VERT_SPACING;

    // S-curve horizontal offset (sinusoidal)
    const xOffset = Math.sin(dist * 0.8) * S_AMPLITUDE;
    const x = centerX + xOffset;

    // size based on distance
    const absDist = Math.abs(dist);
    let size, opacity, fontSize;
    if(absDist < 0.3){
      size = CENTER_SIZE;
      opacity = 1;
      fontSize = 44;
    } else if(absDist < 1.3){
      const t = (absDist - 0.3) / 1.0;
      size = CENTER_SIZE - (CENTER_SIZE - SMALL_SIZE) * t;
      opacity = 1 - 0.3 * t;
      fontSize = 44 - (44 - 22) * t;
    } else if(absDist < 2.3){
      const t = (absDist - 1.3) / 1.0;
      size = SMALL_SIZE - (SMALL_SIZE - TINY_SIZE) * t;
      opacity = 0.7 - 0.35 * t;
      fontSize = 22 - (22 - 16) * t;
    } else {
      size = TINY_SIZE;
      opacity = Math.max(0, 0.35 - (absDist - 2.3) * 0.3);
      fontSize = 16;
    }

    // hide if too far
    if(absDist > 3.2) opacity = 0;

    const circle = document.getElementById(`circle-${i}`);
    const ring = document.getElementById(`ring-${i}`);
    const label = document.getElementById(`label-${i}`);

    // transition
    if(smooth){
      el.style.transition = 'all .45s cubic-bezier(.22,1,.36,1)';
    } else {
      el.style.transition = 'none';
    }

    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = 'translate(-50%,-50%)';
    el.style.opacity = opacity;
    el.style.zIndex = Math.round(10 - absDist);

    circle.style.width = size + 'px';
    circle.style.height = size + 'px';
    circle.style.fontSize = fontSize + 'px';

    // active: show ring + label
    const isActive = absDist < 0.3;
    ring.style.borderColor = isActive ? m.color : 'transparent';
    ring.style.boxShadow = isActive ? `0 0 20px ${m.glow}` : 'none';

    label.style.opacity = isActive ? '1' : '0';
    label.style.fontSize = isActive ? 'clamp(24px,7vw,36px)' : '0px';
    label.style.color = isActive ? m.color : 'transparent';
    label.style.letterSpacing = isActive ? '3px' : '0px';
  });
}

// Draw the S-curve path as SVG
function drawPath(w, h, cx){
  const centerY = h / 2;
  const pts = [];
  for(let d = -3.5; d <= 3.5; d += 0.1){
    const y = centerY + d * VERT_SPACING;
    const x = cx + Math.sin(d * 0.8) * S_AMPLITUDE;
    pts.push({x, y});
  }
  let pathD = `M ${pts[0].x} ${pts[0].y}`;
  for(let i = 1; i < pts.length; i++){
    pathD += ` L ${pts[i].x} ${pts[i].y}`;
  }
  curvePath.innerHTML = `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;top:0;left:0">
      <defs>
        <linearGradient id="pathGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="white" stop-opacity="0"/>
          <stop offset="30%" stop-color="white" stop-opacity=".04"/>
          <stop offset="50%" stop-color="white" stop-opacity=".06"/>
          <stop offset="70%" stop-color="white" stop-opacity=".04"/>
          <stop offset="100%" stop-color="white" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${pathD}" fill="none" stroke="url(#pathGrad)" stroke-width="1.5"/>
    </svg>
  `;
}

// === TOUCH ===
scrollArea.addEventListener('touchstart', (e) => {
  touchStartY = e.touches[0].clientY;
  isDragging = true;
  momentum = 0;
  if(animFrame) cancelAnimationFrame(animFrame);
}, {passive:true});

scrollArea.addEventListener('touchmove', (e) => {
  if(!isDragging) return;
  const y = e.touches[0].clientY;
  const dy = y - touchStartY;
  touchStartY = y;
  // convert px to fraction of item
  offset += dy / VERT_SPACING;
  momentum = dy / VERT_SPACING;
  // absorb full items
  while(offset >= 0.5){
    offset -= 1;
    activeIdx = (activeIdx - 1 + N) % N;
  }
  while(offset <= -0.5){
    offset += 1;
    activeIdx = (activeIdx + 1) % N;
  }
  render(false);
}, {passive:true});

scrollArea.addEventListener('touchend', () => {
  isDragging = false;
  decelerate();
});

// === MOUSE ===
scrollArea.addEventListener('mousedown', (e) => {
  touchStartY = e.clientY;
  isDragging = true;
  momentum = 0;
  if(animFrame) cancelAnimationFrame(animFrame);
  const mv = (ev) => {
    const dy = ev.clientY - touchStartY;
    touchStartY = ev.clientY;
    offset += dy / VERT_SPACING;
    momentum = dy / VERT_SPACING;
    while(offset >= 0.5){offset -= 1; activeIdx = (activeIdx - 1 + N) % N}
    while(offset <= -0.5){offset += 1; activeIdx = (activeIdx + 1) % N}
    render(false);
  };
  const up = () => {
    isDragging = false;
    decelerate();
    document.removeEventListener('mousemove', mv);
    document.removeEventListener('mouseup', up);
  };
  document.addEventListener('mousemove', mv);
  document.addEventListener('mouseup', up);
});

// Decelerate + snap
function decelerate(){
  if(Math.abs(momentum) < 0.005 && Math.abs(offset) < 0.01){
    offset = 0;
    render(true);
    return;
  }
  offset += momentum;
  momentum *= 0.88;

  while(offset >= 0.5){offset -= 1; activeIdx = (activeIdx - 1 + N) % N}
  while(offset <= -0.5){offset += 1; activeIdx = (activeIdx + 1) % N}

  // snap spring
  if(Math.abs(momentum) < 0.01){
    offset *= 0.7; // spring toward 0
  }

  render(false);
  animFrame = requestAnimationFrame(decelerate);
}

// Enter
btnEnter.addEventListener('click', () => triggerTransition(MEMBERS[activeIdx]));
btnDaily.addEventListener('click', () => triggerTransition({label:"TODAY'S OBSERVATION",color:'#b0b8ff'}));

function triggerTransition(m){
  transText.textContent = m.label;
  transText.style.color = m.color;
  trans.classList.add('active');
  setTimeout(() => {
    alert(`→ ${m.label} のアーカイブへ入場\n\n（プロトタイプ：ここからカードビューに遷移します）`);
    trans.classList.remove('active');
  }, 1000);
}

// Init
render(false);
window.addEventListener('resize', () => render(false));
</script>
