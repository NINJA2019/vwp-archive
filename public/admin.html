<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MU-TH-UR 6000 — V.W.P ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=7">
</head>
<body>
<div class="crt-wrap">
  <div class="crt-flicker"></div>

  <div id="auth-gate">
    <canvas id="grid-bg"></canvas>
    <div class="terminal" id="terminal">
      <div class="sys-id">
        <div class="mu">MU-TH-UR 6000</div>
        <div class="designation">V.W.P ARCHIVE</div>
        <div class="sub">INTERFACE 2037 — NOSTROMO TERMINAL</div>
      </div>
      <div class="status-log" id="status-log"></div>
      <div class="auth-area" id="auth-area">
        <div class="auth-prompt">AUTHORIZATION REQUIRED</div>
        <div class="auth-input-wrap">
          <input type="password" id="auth-input" placeholder="ENTER ACCESS CODE" autocomplete="off">
        </div>
        <div class="auth-err" id="auth-err"></div>
      </div>
      <div class="auth-footer">
        WEYLAND-YUTANI CORP — BUILDING BETTER WORLDS<br>
        SYSTEM REQUIRES LEVEL-3 CLEARANCE
      </div>
    </div>
  </div>

  <div class="boot-seq" id="boot-seq">
    <div class="boot-text" id="boot-text">REACTIVATING SYSTEM...</div>
    <div class="boot-bar-outer"><div class="boot-bar-inner" id="boot-bar"></div></div>
  </div>

  <div class="admin-shell" id="admin-shell">
    <header class="admin-header">
      <div class="admin-title"><strong>MU-TH-UR</strong> — V.W.P ARCHIVE TERMINAL</div>
      <button class="admin-logout" id="logout-btn">DISCONNECT</button>
    </header>
    <nav class="tab-nav" id="tab-nav"></nav>
    <main class="tab-content" id="tab-content"></main>
  </div>

</div>

<div id="modal-root"></div>

<script src="admin.js?v=9"></script>
</body>
</html>
