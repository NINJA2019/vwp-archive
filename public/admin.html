<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V.W.P ARCHIVE — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Barlow+Condensed:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="auth-gate">
  <canvas id="grid-bg"></canvas>
  <div class="terminal" id="terminal">
    <div class="glyph-row" id="glyphs"></div>
    <div class="sys-id">
      <div class="designation">V.W.P ARCHIVE</div>
      <div class="sub">OBSERVATION TERMINAL — NODE 07</div>
    </div>
    <div class="status-log" id="status-log"></div>
    <div class="auth-area" id="auth-area">
      <div class="auth-prompt">AUTHORIZATION SEQUENCE</div>
      <div class="auth-input-wrap">
        <input type="password" id="auth-input" placeholder="ENTER CODE" autocomplete="off">
      </div>
      <div class="auth-err" id="auth-err"></div>
    </div>
    <div class="auth-footer">
      ARCHIVE SYSTEMS v2.7.1 — LAST ACTIVE: 2,847 CYCLES AGO<br>
      MAINTENANCE PROTOCOL REQUIRES LEVEL-3 CLEARANCE
    </div>
  </div>
</div>

<div class="boot-seq" id="boot-seq">
  <div class="boot-text" id="boot-text">REACTIVATING SYSTEM...</div>
  <div class="boot-bar-outer"><div class="boot-bar-inner" id="boot-bar"></div></div>
</div>

<div class="admin-shell" id="admin-shell" style="display:none">
  <header class="admin-header">
    <div class="admin-title"><strong>ADMIN</strong> — V.W.P ARCHIVE</div>
    <button class="admin-logout" id="logout-btn">LOGOUT</button>
  </header>
  <nav class="tab-nav" id="tab-nav"></nav>
  <main class="tab-content" id="tab-content"></main>
</div>

<script src="admin.js"></script>
</body>
</html>
