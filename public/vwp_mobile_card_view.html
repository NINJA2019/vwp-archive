<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>V.W.P ARCHIVE — Mobile Card View Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Shippori+Mincho:wght@400;600&family=Barlow+Condensed:wght@300;400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#07090e;
  --surface:#0c0f18;
  --surface2:#111627;
  --text:#e8ecf8;
  --text-sub:rgba(232,236,248,.45);
  --text-dim:rgba(232,236,248,.25);
  --border:rgba(255,255,255,.06);
  --card-r:20px;
  /* member */
  --c-all:#b0b8ff;
  --c-vwp:#c4b5fd;
  --c-kafu:#ffb7c5;
  --c-rime:#7eb8f7;
  --c-harusar:#ff7070;
  --c-isekai:#d8d8d8;
  --c-koko:#c084fc;
  --active-color:var(--c-all);
}

html,body{
  height:100%;width:100%;
  background:var(--bg);color:var(--text);
  font-family:'Noto Sans JP','Barlow Condensed',sans-serif;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

/* ===== APP SHELL ===== */
.app{
  display:flex;flex-direction:column;
  height:100%;max-width:430px;margin:0 auto;
  position:relative;overflow:hidden;
}

/* ===== AMBIENT GLOW ===== */
.glow{
  position:absolute;
  top:30%;left:50%;
  width:300px;height:300px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  filter:blur(90px);
  opacity:.25;
  background:var(--active-color);
  transition:background .8s ease,opacity .8s ease;
  pointer-events:none;z-index:0;
}

/* ===== HEADER ===== */
.hdr{
  position:relative;z-index:20;
  padding:14px 16px 0;
  flex-shrink:0;
}
.hdr-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.hdr-logo{
  font-family:'Cinzel',serif;
  font-size:10px;letter-spacing:2.5px;
  color:var(--text-sub);text-transform:uppercase;
  line-height:1;
}
.hdr-logo span{
  font-size:7px;letter-spacing:1.5px;
  display:block;margin-top:2px;
  color:var(--text-dim);
}
.hdr-icons{
  display:flex;gap:8px;align-items:center;
}
.hdr-btn{
  width:32px;height:32px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  cursor:pointer;transition:background .15s;
}
.hdr-btn:active{background:rgba(255,255,255,.1)}
.hdr-btn svg{width:15px;height:15px;stroke:var(--text-sub);stroke-width:1.6;fill:none}

/* search bar */
.search-bar{
  display:flex;align-items:center;gap:8px;
  padding:0 12px;height:38px;
  border-radius:12px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  margin-bottom:10px;
}
.search-bar svg{width:15px;height:15px;stroke:var(--text-dim);stroke-width:1.8;fill:none;flex-shrink:0}
.search-bar input{
  flex:1;background:none;border:none;outline:none;
  font-family:'Noto Sans JP',sans-serif;font-size:13px;
  color:var(--text);
}
.search-bar input::placeholder{color:var(--text-dim);font-size:12px}

/* ===== MEMBER FILTER CHIPS ===== */
.chips{
  display:flex;gap:6px;
  overflow-x:auto;
  padding:0 0 10px;
  scrollbar-width:none;
  -ms-overflow-style:none;
  scroll-snap-type:x mandatory;
}
.chips::-webkit-scrollbar{display:none}

.chip{
  flex-shrink:0;
  display:flex;align-items:center;gap:5px;
  padding:6px 14px;
  border-radius:20px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  font-family:'Barlow Condensed',sans-serif;
  font-size:12px;font-weight:400;
  letter-spacing:.8px;
  color:var(--text-sub);
  cursor:pointer;
  transition:all .25s ease;
  scroll-snap-align:start;
  white-space:nowrap;
}
.chip .emoji{font-size:13px}
.chip.active{
  background:rgba(255,255,255,.1);
  border-color:rgba(255,255,255,.18);
  color:var(--text);
}

/* ===== SORT / COUNT BAR ===== */
.sort-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 0 8px;
  font-family:'Barlow Condensed',sans-serif;
}
.sort-label{
  font-size:11px;font-weight:300;
  letter-spacing:1.5px;color:var(--text-dim);
  text-transform:uppercase;
}
.sort-count{
  font-size:12px;font-weight:400;
  color:var(--text-sub);
  letter-spacing:.5px;
}
.sort-count b{color:var(--text);font-weight:600}

/* ===== CARD VIEWPORT ===== */
.card-viewport{
  flex:1;
  position:relative;z-index:5;
  overflow:hidden;
  /* padding to show card edges */
  padding:0 16px;
}

.card-track{
  position:relative;
  width:100%;height:100%;
}

/* ===== SINGLE CARD ===== */
.card{
  position:absolute;
  left:0;right:0;
  height:calc(100% - 16px);
  border-radius:var(--card-r);
  overflow:hidden;
  will-change:transform,opacity;
  transition:transform .45s cubic-bezier(.22,1,.36,1),opacity .45s ease;
  box-shadow:0 4px 24px rgba(0,0,0,.4),0 1px 4px rgba(0,0,0,.2);
  cursor:grab;
}
.card:active{cursor:grabbing}

/* vertical stack positions */
.card[data-pos="0"]{z-index:4;transform:translateY(0) scale(1);opacity:1}
.card[data-pos="1"]{z-index:3;transform:translateY(12px) scale(.97);opacity:.55;pointer-events:none}
.card[data-pos="2"]{z-index:2;transform:translateY(24px) scale(.94);opacity:.3;pointer-events:none}
.card[data-pos="hide"]{z-index:1;transform:translateY(40px) scale(.9);opacity:0;pointer-events:none}

/* swipe out */
.card.out-up{transform:translateY(-130%) scale(.95) rotate(-3deg)!important;opacity:0!important;transition:transform .4s ease,opacity .35s ease}
.card.out-down{transform:translateY(130%) scale(.95) rotate(3deg)!important;opacity:0!important;transition:transform .4s ease,opacity .35s ease}

/* === CARD INNER === */
.card-inner{
  width:100%;height:100%;
  position:relative;
  display:flex;flex-direction:column;
  background:var(--surface);
}

/* thumbnail area (top ~62%) */
.card-thumb{
  flex:1;position:relative;overflow:hidden;
  min-height:0;
}
.card-thumb img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .3s ease;
}
.card.lp-peek .card-thumb img{
  transform:scale(1.03);
}
/* gradient over thumb */
.card-thumb::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(7,9,14,0) 30%,
    rgba(7,9,14,.7) 75%,
    rgba(12,15,24,.95) 100%
  );
  pointer-events:none;
}

/* info area (bottom) */
.card-info{
  position:relative;z-index:3;
  padding:0 20px 18px;
  flex-shrink:0;
  background:var(--surface);
}

/* member color bar */
.card-color-bar{
  height:2px;margin-bottom:14px;
  border-radius:1px;
  opacity:.6;
}

.card-member{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:400;
  letter-spacing:2px;text-transform:uppercase;
  margin-bottom:5px;
}
.card-title{
  font-family:'Shippori Mincho',serif;
  font-size:19px;font-weight:600;
  line-height:1.45;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:8px;
}
.card-date{
  font-family:'Barlow Condensed',sans-serif;
  font-size:11px;font-weight:300;
  color:var(--text-dim);
  letter-spacing:1px;
  margin-bottom:10px;
}
.card-tags{
  display:flex;gap:5px;flex-wrap:wrap;
}
.card-tag{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;font-weight:300;
  letter-spacing:.8px;
  padding:3px 10px;border-radius:16px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:var(--text-sub);
}

/* === LP DISC PEEK (right side) — hidden until tap === */
.lp-peek-wrap{
  position:absolute;
  top:35%;right:0;
  transform:translate(105%,-50%) rotate(0deg);
  transition:transform .55s cubic-bezier(.22,1,.36,1), opacity .4s ease;
  pointer-events:none;z-index:2;
  opacity:0;
}
.card.lp-peek .lp-peek-wrap{
  transform:translate(40%,-50%) rotate(25deg);
  opacity:1;
}

/* === YOUTUBE CTA (appears on tap) === */
.card-cta{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0);
  z-index:10;
  display:flex;align-items:center;gap:8px;
  padding:12px 24px;
  border-radius:28px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.15);
  transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .3s ease;
  opacity:0;
  cursor:pointer;
}
.card.lp-peek .card-cta{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
  transition-delay:.15s;
}
.card-cta svg{width:18px;height:18px;fill:var(--text);flex-shrink:0}
.card-cta span{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:400;letter-spacing:1.5px;
  color:var(--text);white-space:nowrap;
}
.card-cta:active{background:rgba(255,255,255,.2)}

/* === PIN BUTTON (add to shelf) === */
.card-pin{
  position:absolute;top:14px;right:14px;z-index:10;
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.08);
  cursor:pointer;transition:all .2s;
}
.card-pin:active{transform:scale(.88)}
.card-pin svg{width:16px;height:16px;stroke:var(--text-sub);stroke-width:1.8;fill:none}
.card-pin.pinned svg{fill:var(--active-color);stroke:var(--active-color)}

/* ===== BOTTOM MINI-CONTROL ===== */
.bottom-bar{
  position:relative;z-index:20;
  flex-shrink:0;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0));
  display:flex;align-items:center;justify-content:center;gap:32px;
}

.swipe-indicator{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  opacity:.35;
}
.swipe-indicator svg{width:14px;height:14px;stroke:var(--text);stroke-width:1.5;fill:none}
.swipe-indicator .bar{
  width:40px;height:3px;border-radius:2px;
  background:rgba(255,255,255,.2);
}

/* progress text */
.progress-txt{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:300;
  letter-spacing:1px;color:var(--text-sub);
}
.progress-txt b{font-weight:600;color:var(--text);font-size:16px}

/* ===== REDUCED MOTION ===== */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}

/* desktop frame for preview */
@media(min-width:431px){
  .app{
    border:1px solid rgba(255,255,255,.05);
    border-radius:40px;
    height:92vh;margin-top:4vh;
    box-shadow:0 0 100px rgba(0,0,0,.6);
  }
}
</style>
</head>
<body>

<div class="app">
  <div class="glow" id="glow"></div>

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-logo">
        V.W.P ARCHIVE
        <span>UNOFFICIAL</span>
      </div>
      <div class="hdr-icons">
        <div class="hdr-btn" title="テーマ切替">
          <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/></svg>
        </div>
        <div class="hdr-btn" title="言語">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg>
        </div>
      </div>
    </div>

    <!-- search -->
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" placeholder="曲名・メンバーで検索…" id="searchInput">
    </div>

    <!-- member chips -->
    <div class="chips" id="chips"></div>

    <!-- sort bar -->
    <div class="sort-bar">
      <div class="sort-label">新しい順</div>
      <div class="sort-count" id="sortCount"><b>0</b> 曲</div>
    </div>
  </div>

  <!-- CARD VIEWPORT -->
  <div class="card-viewport">
    <div class="card-track" id="cardTrack"></div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="swipe-indicator">
      <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg>
      <div class="bar"></div>
      <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="progress-txt" id="progress"><b>1</b> / 30</div>
  </div>
</div>

<script>
// ===== MOCK DATA (simulates Supabase response) =====
const MEMBERS = [
  {id:'all',label:'すべて',emoji:'✦',color:'#b0b8ff'},
  {id:'vwp',label:'V.W.P',emoji:'✦',color:'#c4b5fd'},
  {id:'kafu',label:'花譜',emoji:'🌸',color:'#ffb7c5'},
  {id:'rime',label:'理芽',emoji:'🌱',color:'#7eb8f7'},
  {id:'harusar',label:'春猿火',emoji:'🔥',color:'#ff7070'},
  {id:'isekai',label:'ヰ世界情緒',emoji:'🌼',color:'#d8d8d8'},
  {id:'koko',label:'幸祜',emoji:'⚡',color:'#c084fc'},
];
const MC = Object.fromEntries(MEMBERS.map(m=>[m.id,m.color]));

// mock songs with real V.W.P video IDs for thumbnails
const ALL_SONGS = [
  {id:'1',title:'魔女',member:'vwp',memberLabel:'V.W.P',vid:'VRPxao3e_jY',tags:['シングル'],date:'2021-04-27'},
  {id:'2',title:'共鳴',member:'kafu',memberLabel:'花譜',vid:'z2DWuGEiimw',tags:['シングル','系譜曲'],date:'2022-03-16'},
  {id:'3',title:'運命',member:'vwp',memberLabel:'V.W.P',vid:'Ue0UpQBmA5s',tags:['アルバム'],date:'2023-08-23'},
  {id:'4',title:'花と剣',member:'harusar',memberLabel:'春猿火',vid:'e6EK1Pc-x2U',tags:['シングル','系譜曲'],date:'2022-06-15'},
  {id:'5',title:'identity',member:'rime',memberLabel:'理芽',vid:'AXGP4Pjx20g',tags:['シングル'],date:'2021-09-01'},
  {id:'6',title:'現象',member:'vwp',memberLabel:'V.W.P',vid:'ByBaaxqJprE',tags:['ライブ'],date:'2024-01-20'},
  {id:'7',title:'邂逅',member:'isekai',memberLabel:'ヰ世界情緒',vid:'Jv9yDp1NQWU',tags:['シングル','系譜曲'],date:'2022-10-05'},
  {id:'8',title:'雷鳴',member:'koko',memberLabel:'幸祜',vid:'_G-fxJL_hcI',tags:['シングル'],date:'2022-04-20'},
  {id:'9',title:'覚醒',member:'vwp',memberLabel:'V.W.P',vid:'gP8YXYQA8IA',tags:['アルバム'],date:'2024-07-10'},
  {id:'10',title:'不可解',member:'kafu',memberLabel:'花譜',vid:'6FkYOPJahfc',tags:['ワンマン'],date:'2019-08-31'},
  {id:'11',title:'心臓と絡繰',member:'kafu',memberLabel:'花譜',vid:'BRuvVuB-67U',tags:['シングル'],date:'2020-06-17'},
  {id:'12',title:'飛翔',member:'harusar',memberLabel:'春猿火',vid:'W18Sxv1E4wE',tags:['シングル'],date:'2023-02-08'},
  {id:'13',title:'メイドインリビング',member:'rime',memberLabel:'理芽',vid:'qR0H4GhPVaM',tags:['シングル'],date:'2023-11-22'},
  {id:'14',title:'pheles',member:'koko',memberLabel:'幸祜',vid:'Rk03VyJkwXk',tags:['シングル'],date:'2023-05-15'},
  {id:'15',title:'回夜',member:'isekai',memberLabel:'ヰ世界情緒',vid:'yQE0C3WlYhg',tags:['シングル'],date:'2023-09-01'},
];

// ===== STATE =====
let filteredSongs = [...ALL_SONGS];
let currentIdx = 0;
let activeMember = 'all';
let touchStartY = 0, touchCurY = 0, isDragging = false;
let tappedCard = null;

// ===== DOM =====
const cardTrack = document.getElementById('cardTrack');
const glowEl = document.getElementById('glow');
const chipsEl = document.getElementById('chips');
const sortCountEl = document.getElementById('sortCount');
const progressEl = document.getElementById('progress');
const searchInput = document.getElementById('searchInput');

// ===== LP DISC (canvas) =====
function drawLP(canvas, color, size){
  const dpr = window.devicePixelRatio||1;
  canvas.width=size*dpr;canvas.height=size*dpr;
  canvas.style.width=size+'px';canvas.style.height=size+'px';
  const c=canvas.getContext('2d');c.scale(dpr,dpr);
  const cx=size/2,cy=size/2,r=size/2;
  // member tint
  c.globalAlpha=.55;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fillStyle=color;c.fill();
  // dark overlay
  c.globalAlpha=.45;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fillStyle='#000';c.fill();
  // grooves
  c.globalAlpha=.07;c.strokeStyle='#fff';c.lineWidth=.5;
  for(let i=r*.22;i<r*.88;i+=3){c.beginPath();c.arc(cx,cy,i,0,Math.PI*2);c.stroke()}
  // shine
  c.globalAlpha=.1;
  const g=c.createRadialGradient(cx*.55,cy*.55,0,cx,cy,r);
  g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=g;c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fill();
  // label
  c.globalAlpha=.85;c.beginPath();c.arc(cx,cy,r*.17,0,Math.PI*2);c.fillStyle=color;c.fill();
  c.globalAlpha=.55;c.beginPath();c.arc(cx,cy,r*.11,0,Math.PI*2);c.fillStyle='#111';c.fill();
  c.globalAlpha=.7;c.beginPath();c.arc(cx,cy,r*.035,0,Math.PI*2);c.fillStyle='#222';c.fill();
  c.globalAlpha=1;
}

// ===== MEMBER CHIPS =====
function renderChips(){
  chipsEl.innerHTML='';
  MEMBERS.forEach(m=>{
    const el=document.createElement('div');
    el.className='chip'+(m.id===activeMember?' active':'');
    el.innerHTML=`<span class="emoji">${m.emoji}</span>${m.label}`;
    if(m.id===activeMember){
      el.style.borderColor=m.color+'44';
      el.style.boxShadow=`0 0 12px ${m.color}22`;
    }
    el.addEventListener('click',()=>{
      activeMember=m.id;
      currentIdx=0;
      filterAndRender();
    });
    chipsEl.appendChild(el);
  });
}

// ===== FILTER =====
function filterAndRender(){
  const q=searchInput.value.trim().toLowerCase();
  filteredSongs=ALL_SONGS.filter(s=>{
    const memberMatch=activeMember==='all'||s.member===activeMember
      ||(activeMember==='vwp'&&s.member==='vwp');
    const searchMatch=!q||s.title.toLowerCase().includes(q)||s.memberLabel.toLowerCase().includes(q);
    return memberMatch&&searchMatch;
  });
  currentIdx=0;
  renderCards();
  renderChips();
  updateMeta();
}

// ===== RENDER CARDS =====
function renderCards(){
  cardTrack.innerHTML='';
  if(filteredSongs.length===0){
    cardTrack.innerHTML=`
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">
        <svg width="40" height="40" viewBox="0 0 24 24" stroke="rgba(255,255,255,.15)" stroke-width="1.2" fill="none">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <span style="font-family:'Shippori Mincho',serif;font-size:14px;color:var(--text-sub)">
          該当する曲がありません
        </span>
      </div>`;
    return;
  }
  // show up to 3 stacked cards
  const count=Math.min(3,filteredSongs.length);
  for(let i=count-1;i>=0;i--){
    const idx=(currentIdx+i)%filteredSongs.length;
    cardTrack.appendChild(createCard(filteredSongs[idx],i));
  }
  // update glow
  const cur=filteredSongs[currentIdx%filteredSongs.length];
  const color=MC[cur.member]||MC.all;
  glowEl.style.background=color;
  document.documentElement.style.setProperty('--active-color',color);
  // attach swipe to front
  const front=cardTrack.querySelector('[data-pos="0"]');
  if(front)attachVerticalSwipe(front);
}

function createCard(song,pos){
  const color=MC[song.member]||MC.all;
  const card=document.createElement('div');
  card.className='card';
  card.dataset.pos=pos<=2?pos:'hide';
  card.dataset.sid=song.id;

  const thumbUrl=`https://img.youtube.com/vi/${song.vid}/mqdefault.jpg`;

  // LP disc
  const lpWrap=document.createElement('div');
  lpWrap.className='lp-peek-wrap';
  const canvas=document.createElement('canvas');
  drawLP(canvas,color,140);
  lpWrap.appendChild(canvas);

  card.innerHTML=`
    <div class="card-inner">
      <div class="card-thumb">
        <img src="${thumbUrl}" alt="${song.title}" loading="lazy"
             onerror="this.parentElement.style.background='var(--surface2)'">
      </div>
      <div class="card-info">
        <div class="card-color-bar" style="background:linear-gradient(90deg,${color},transparent)"></div>
        <div class="card-member" style="color:${color}">${song.memberLabel}</div>
        <div class="card-title">${song.title}</div>
        <div class="card-date">${song.date}</div>
        <div class="card-tags">${song.tags.map(t=>`<span class="card-tag">${t}</span>`).join('')}</div>
      </div>
      <div class="card-pin" role="button" aria-label="棚に追加">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 8 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8z"/>
          <circle cx="12" cy="10" r="2.5" fill="none"/>
        </svg>
      </div>
      <div class="card-cta" role="button">
        <svg viewBox="0 0 24 24"><polygon points="8,5 20,12 8,19"/></svg>
        <span>YOUTUBE</span>
      </div>
    </div>
  `;

  card.appendChild(lpWrap);

  // tap → LP peek + CTA
  card.addEventListener('click',(e)=>{
    if(Math.abs(touchCurY-touchStartY)>15)return;
    if(e.target.closest('.card-pin')||e.target.closest('.card-cta'))return;
    card.classList.toggle('lp-peek');
  });

  // pin button
  const pinBtn=card.querySelector('.card-pin');
  pinBtn.addEventListener('click',(e)=>{
    e.stopPropagation();
    pinBtn.classList.toggle('pinned');
  });

  // CTA → YouTube
  const cta=card.querySelector('.card-cta');
  cta.addEventListener('click',(e)=>{
    e.stopPropagation();
    alert(`▶ YouTubeへ遷移:\n${song.title}\n\n（プロトタイプのため実際には遷移しません）`);
  });

  return card;
}

// ===== VERTICAL SWIPE =====
function attachVerticalSwipe(card){
  card.addEventListener('touchstart',onTS,{passive:true});
  card.addEventListener('touchmove',onTM,{passive:true});
  card.addEventListener('touchend',onTE);
  // mouse
  card.addEventListener('mousedown',onMD);
}

function onTS(e){touchStartY=e.touches[0].clientY;touchCurY=touchStartY;isDragging=true;this.style.transition='none'}
function onTM(e){
  if(!isDragging)return;touchCurY=e.touches[0].clientY;
  const dy=touchCurY-touchStartY;
  this.style.transform=`translateY(${dy}px) scale(${Math.max(.95,1-Math.abs(dy)/800)}) rotate(${dy*-0.02}deg)`;
  this.style.opacity=Math.max(.3,1-Math.abs(dy)/400);
}
function onTE(){
  if(!isDragging)return;isDragging=false;
  const dy=touchCurY-touchStartY;
  this.style.transition='';
  if(Math.abs(dy)>70){
    this.classList.add(dy<0?'out-up':'out-down');
    setTimeout(()=>{
      if(dy<0){
        // swipe up → go back (prev)
        currentIdx=(currentIdx-1+filteredSongs.length)%filteredSongs.length;
      }else{
        // swipe down → go forward (next)
        currentIdx=(currentIdx+1)%filteredSongs.length;
      }
      renderCards();updateMeta();
    },350);
  }else{
    this.style.transform='';this.style.opacity='';
  }
}

function onMD(e){
  touchStartY=e.clientY;touchCurY=touchStartY;isDragging=true;
  this.style.transition='none';
  const card=this;
  const move=(ev)=>{
    touchCurY=ev.clientY;const dy=touchCurY-touchStartY;
    card.style.transform=`translateY(${dy}px) scale(${Math.max(.95,1-Math.abs(dy)/800)}) rotate(${dy*-0.02}deg)`;
    card.style.opacity=Math.max(.3,1-Math.abs(dy)/400);
  };
  const up=()=>{
    isDragging=false;card.style.transition='';
    const dy=touchCurY-touchStartY;
    if(Math.abs(dy)>70){
      card.classList.add(dy<0?'out-up':'out-down');
      setTimeout(()=>{
        if(dy<0){
          currentIdx=(currentIdx-1+filteredSongs.length)%filteredSongs.length;
        }else{
          currentIdx=(currentIdx+1)%filteredSongs.length;
        }
        renderCards();updateMeta();
      },350);
    }else{card.style.transform='';card.style.opacity=''}
    document.removeEventListener('mousemove',move);
    document.removeEventListener('mouseup',up);
  };
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',up);
}

// ===== META =====
function updateMeta(){
  sortCountEl.innerHTML=`<b>${filteredSongs.length}</b> 曲`;
  if(filteredSongs.length>0){
    progressEl.innerHTML=`<b>${(currentIdx%filteredSongs.length)+1}</b> / ${filteredSongs.length}`;
  }else{
    progressEl.innerHTML='—';
  }
}

// ===== SEARCH =====
searchInput.addEventListener('input',()=>{
  filterAndRender();
});

// ===== INIT =====
renderChips();
filterAndRender();
</script>
