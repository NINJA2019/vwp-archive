[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/result/"
  to = "/.netlify/functions/observer-link-result"
  status = 200
  force = true

[[redirects]]
  from = "/result/*"
  to = "/.netlify/functions/observer-link-result"
  status = 200
  force = true
  [redirects.query]
    id = ":id"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# --- Cache headers ---
# Static assets (icons, images) — long cache with immutable
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

# CSS/JS — cache with revalidation (ETag handles freshness)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# HTML — always revalidate
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fonts — long cache
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers (all pages)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
